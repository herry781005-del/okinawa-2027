<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沖繩家族旅行 記帳 2027/2/24–2/28</title>

<meta name="theme-color" content="#0b6e99">
<style>
:root{--ink:#1f2933;--muted:#5f6b7a;--line:#e3e6ea;--bg:#f6f7f9;--card:#fff;--accent:#0b6e99}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",sans-serif;}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 40px}
.hero{background:linear-gradient(135deg,#0b6e99 0%,#14a3a3 60%,#7fd1c3 100%);color:#fff;padding:28px 16px 64px}
.hero .in{max-width:1120px;margin:0 auto}
.hero h1{margin:0 0 6px;font-size:clamp(24px,6vw,36px);line-height:1.3;letter-spacing:.02em}
.hero p{margin:0;opacity:.95}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:-44px 0 16px}
.sum .it{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;gap:10px;align-items:flex-start}
.sum .it .ic{color:var(--accent);flex:none;margin-top:3px}
.sum .k{font-size:13px;color:var(--muted)}
.sum .v{font-weight:700;font-size:16px;line-height:1.4}
.reco{background:#fffbea;border:2px solid #f4b400;border-radius:16px;padding:16px 18px;margin:0 0 14px}
.reco .lbl{display:inline-block;background:#f4b400;color:#3b2b00;font-weight:700;border-radius:999px;padding:2px 12px;font-size:14px;margin-bottom:6px}
.reco p{margin:4px 0;font-size:17px}
.rate{font-size:14px;color:var(--muted);background:#fff;border-radius:12px;padding:10px 14px;border:1px solid var(--line);margin-bottom:10px}
nav.toc{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
nav.toc a{flex:none;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink)}
section{background:var(--card);border-radius:18px;padding:18px 16px;margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
h2{font-size:22px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .num{background:var(--accent);color:#fff;border-radius:8px;font-size:15px;padding:1px 9px}
h3{font-size:18px;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
h4{margin:0 0 6px;font-size:16px}
.small{font-size:13.5px;color:var(--muted)}
.muted{color:var(--muted)}
.pchip{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;color:#fff;font-weight:800;font-size:15px;margin-right:6px;padding:0 6px;text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px 1px 7px;margin:2px 4px 2px 0;white-space:nowrap}
.badge.cheap{background:#e6f4ea;color:#0b7a3e}.badge.fast{background:#f1e8f8;color:#6c2d91}.badge.comfy{background:#fde7ef;color:#a3134a}
.bi{vertical-align:-2px}
.pill{display:inline-block;font-size:12.5px;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.pill.ok{background:#e6f4ea;color:#0b7a3e}.pill.warn{background:#fff4e0;color:#a35b00}
.lb{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:0 5px;line-height:1.6;margin:0 2px;white-space:nowrap}
.lb.q{background:#e6f4ea;color:#0b7a3e}.lb.e{background:#fff1d6;color:#9a5b00}.lb.n{background:#eceff3;color:#5f6b7a}
a.tref{font-weight:700;font-size:13px;background:#e8f0fe;border-radius:5px;padding:0 4px;text-decoration:none}
a.src{font-size:13px;word-break:break-all;white-space:normal}
.tw{white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin:6px 0 10px}
/* tables */
.tw-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border:1px solid var(--line);border-radius:12px}
table.data{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px}
table.data caption{text-align:left;padding:8px 10px;font-size:13.5px;color:var(--muted)}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.data thead th{background:#f1f4f7;font-size:13.5px;color:#3c4652;position:sticky;top:0;white-space:nowrap}
table.data tbody th{font-weight:700;background:#fcfcfd}
table.data td.num,table.data th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.data tbody tr:nth-child(even) td{background:#fafbfc}
table.data tr.hl td,table.data tr.hl th{background:#eefaf2 !important}
table.sortable thead th{cursor:pointer;user-select:none}
table.sortable thead th.js:after{content:" ⇅";color:#9aa3ad;font-size:11px}
table.sortable thead th.asc:after{content:" ▲";color:var(--accent)}
table.sortable thead th.desc:after{content:" ▼";color:var(--accent)}
table.overview{min-width:640px}
table.overview tbody tr td:first-child,table.overview tbody tr th{border-left:5px solid var(--c)}
table.cost{min-width:0}
table.wide{min-width:880px}
table.data tbody th{min-width:6.5em}
table.cost td:first-child,table.cost th:first-child{min-width:7em}
.tw-wrap table.data:not(.cost) tbody th{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.scrollhint{display:none;font-size:12.5px;color:var(--muted);margin:4px 0 -4px}
@media (max-width:719px){.scrollhint{display:block}}
table.cost tfoot th,table.cost tfoot td{background:#f1f4f7;font-weight:800;font-size:16px}
table.timing{min-width:760px}
/* bars */
.charts{display:grid;gap:18px}
.bars{position:relative;padding-bottom:22px}
.brow{display:grid;grid-template-columns:1fr;gap:2px;margin:10px 0}
.blabel{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:15px}
.blabel b{margin-right:6px}
.bwrap svg.bar{display:block;width:100%;height:26px;border-radius:6px;background:#f6f7f9}
.bval{font-size:14.5px}
.baxis{position:relative;height:18px;font-size:12px;color:var(--muted);margin-top:4px}
.baxis span{position:absolute;transform:translateX(-10%);white-space:nowrap}
/* map */
.mapgrid{display:grid;gap:16px}
svg.map{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.scens{display:grid;gap:12px}
.scen{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px}
.stitle{font-weight:800;display:flex;align-items:center}
svg.mini{width:100%;max-width:360px;height:auto;display:block;margin:4px auto}
.scen dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.scen dt{color:var(--muted);white-space:nowrap}.scen dd{margin:0}
/* plans */
.plan{background:#fff;border-radius:18px;margin:16px 0;padding:0 16px 16px;border:1px solid var(--line);border-top:8px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.phead{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding-top:14px;align-items:center}
.picons{display:flex;gap:2px;background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:14px;padding:8px}
.ptitle{font-size:20px;font-weight:800;display:flex;align-items:center;flex-wrap:wrap}
.psub{color:var(--muted);font-size:14.5px}
.pprice{grid-column:1/-1;background:#f6f7f9;border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px}
.pprice .big{font-size:26px;font-weight:800;color:var(--c)}
.pprice small{font-size:14px;color:var(--muted);font-weight:400}
.one{font-size:16.5px;background:color-mix(in srgb,var(--c) 7%,#fff);border-left:4px solid var(--c);padding:8px 12px;border-radius:0 10px 10px 0}
.plan h3 .ic{color:var(--c)}
ol.timeline{list-style:none;padding:0;margin:0;position:relative}
ol.timeline li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;position:relative}
ol.timeline li:before{content:"";position:absolute;left:30px;top:44px;bottom:-8px;width:2px;background:color-mix(in srgb,var(--c) 30%,#fff)}
ol.timeline li:last-child:before{display:none}
.tday{background:var(--c);color:#fff;border-radius:12px;text-align:center;padding:4px 2px;line-height:1.25;height:fit-content;position:relative;z-index:1}
.tday b{display:block;font-size:17px}.tday span{font-size:11px}
.twho{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--c);flex-wrap:wrap}
.twho span{color:var(--ink)}
.ttext{font-size:15px}
.tip{font-size:14.5px;background:#f6f7f9;border-radius:10px;padding:8px 12px}
.pc{display:grid;gap:10px}
.pc>div{border-radius:12px;padding:10px 12px}
.pros{background:#eefaf2}.cons{background:#fdeeee}
.pc ul{margin:0;padding:0;list-style:none}
.pc li{padding-left:24px;position:relative;margin:4px 0}
.pros li:before{content:"✓";position:absolute;left:2px;color:#0b7a3e;font-weight:800}
.cons li:before{content:"✗";position:absolute;left:2px;color:#c62828;font-weight:800}
details{margin:8px 0}
summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0}
.notes{display:grid;gap:10px}
.note{border-radius:12px;padding:12px 14px;background:#f6f7f9;border-left:5px solid #9aa3ad}
.note.red{background:#fdeeee;border-color:#c62828}.note.yel{background:#fff8e6;border-color:#f4b400}.note.blu{background:#eef4fd;border-color:#1a73e8}
.note h4{margin-bottom:4px}
.note p{margin:4px 0}
ol.srcs{padding-left:0;list-style:none;columns:1;margin:0}
ol.srcs li{break-inside:avoid;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
ol.srcs li .n{display:inline-block;min-width:30px;color:var(--muted);font-variant-numeric:tabular-nums}
ol.srcs a{word-break:break-word}
footer{color:var(--muted);font-size:13px;text-align:center;padding:16px}
@media (min-width:720px){
 .sum{grid-template-columns:repeat(4,1fr)}

 .brow{grid-template-columns:200px 1fr 170px;align-items:center;gap:10px}
 .baxis{margin-left:210px;margin-right:180px}
 .pc{grid-template-columns:1fr 1fr}
 .scens{grid-template-columns:1fr 1fr}
 .phead{grid-template-columns:auto 1fr auto}
 .pprice{grid-column:auto;display:block;text-align:right;background:none}
 ol.srcs{columns:2;column-gap:28px}
 .section-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
@media (min-width:1000px){

}
@media (max-width:719px){

}
@media print{
 body{background:#fff;font-size:12px}

 nav.toc,.scrollhint{display:none !important}
 section,.plan{box-shadow:none;break-inside:auto;border:1px solid #ccc}

 table.data{min-width:0 !important;font-size:10.5px}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 a.src:after{content:""}
}

 .chips button{font-size:13.5px;min-height:56px}

}

 html{-webkit-text-size-adjust:100%}
 body{font-size:16px}
 nav.sitenav{justify-content:space-between;padding:3px 4px}

</style></head><body><nav class="sitenav" aria-label="網站頁面"><a href="index.html"><span class="ic">🏠</span>首頁</a><a href="itinerary.html"><span class="ic">🗓️</span>行程</a><a href="transport.html"><span class="ic">🚗</span>交通</a><a href="lodging.html"><span class="ic">🏨</span>住宿</a><a href="budget.html"><span class="ic">💰</span>預算</a><a href="ledger.html" aria-current=page><span class="ic">🧾</span>記帳</a></nav>
<div class="hero"><div class="in"><h1>🧾 旅途記帳</h1><p>花了錢就記一筆。</p>
<div class="st" id="st">載入中…</div></div></div>
<div class="wrap">
<section class="add" id="add">
<div class="amtrow"><input id="amt" type="text" inputmode="decimal" placeholder="金額" autocomplete="off" aria-label="金額">
<div class="seg" id="cur" role="group" aria-label="幣別"><button type="button" data-v="JPY" class="on">¥</button><button type="button" data-v="TWD">NT$</button></div></div>
<div class="lbl2">類別</div><div class="chips c5" id="cat"><button type="button" data-v="美食"><small>🍜</small>美食</button><button type="button" data-v="活動"><small>🎟️</small>活動</button><button type="button" data-v="交通雜支"><small>⛽</small>交通</button><button type="button" data-v="購物"><small>🛍️</small>購物</button><button type="button" data-v="其他"><small>📦</small>其他</button></div>
<div class="lbl2">誰付的</div><div class="chips c5" id="payer"><button type="button" data-v="Herry">Herry</button><button type="button" data-v="Lulu">Lulu</button><button type="button" data-v="Sofia">Sofia</button><button type="button" data-v="Allen">Allen</button><button type="button" data-v="Charlene">Charlene</button></div>
<div class="lbl2">買了什麼</div><input id="item" class="txt" type="text" maxlength="60" placeholder="例：美麗海午餐、停車費" autocomplete="off">
<details class="more" id="more"><summary>更多選項：日期・備註・匯率</summary>
<div class="mgrid" style="margin-top:10px">
<div><label for="date">日期</label><input id="date" type="date"></div>
<div><label for="rate">匯率（1 日圓＝? 台幣）</label><input id="rate" type="text" inputmode="decimal" value="0.21"></div>
<div style="grid-column:1/-1"><label for="note">備註</label><input id="note" type="text" maxlength="200" placeholder="選填"></div>
</div></details>
<button class="go" id="go" type="button">＋ 記一筆</button>
<div class="msg" id="msg" role="status"></div>
</section>
<section class="list"><h2>📒 明細 <button type="button" id="refresh" style="margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer">↻ 更新</button></h2><div id="list"></div></section>
<p class="fine">資料存在共用的雲端表，大家的手機看到同一份；收訊不好時會先存在手機，有網路自動補傳（⏳）。記錯了按 ✕ 刪掉再重記。這頁是公開網址，只顯示名字和金額，不放個資。</p>
</div>
<script>
var API="";
var P=["Herry", "Lulu", "Sofia", "Allen", "Charlene"];
var ICON={"美食": "🍜", "活動": "🎟️", "交通雜支": "⛽", "購物": "🛍️", "其他": "📦"};

var K='okinawa2027-ledger-v1';
function $(i){return document.getElementById(i)}
function n0(x){return Math.round(x).toLocaleString('en-US')}
try{var hm=location.hash.match(/api=([^&]+)/);if(hm){localStorage.setItem(K+'-api',decodeURIComponent(hm[1]));history.replaceState(null,'',location.pathname)}}catch(e){}
try{API=localStorage.getItem(K+'-api')||API}catch(e){}
var S={rows:[],pend:[],me:null,cur:'JPY',rate:0.21,unit:'fam',synced:null};
try{var o=JSON.parse(localStorage.getItem(K))||{};for(var k in o)S[k]=o[k]}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function twd(r){return r.cur==='TWD'?+r.amt:+r.amt*(+r.rate||0.21)}
function view(){ // server rows + pending adds − pending deletes
 var dels={},have={};S.pend.forEach(function(q){if(q.action==='del')dels[q.id]=1});
 var out=[];S.rows.forEach(function(r){have[r.id]=1;if(!r.del&&!dels[r.id])out.push(r)});
 S.pend.forEach(function(q){if(q.action==='add'&&!have[q.entry.id]&&!dels[q.entry.id]){var e=Object.assign({pend:1},q.entry);out.push(e)}});
 return out}
// ---------- render ----------
function render(){var rows=view();
 var by={};rows.forEach(function(r){(by[r.date]=by[r.date]||[]).push(r)});
 var days=Object.keys(by).sort().reverse(),h='';
 days.forEach(function(d){var dt=by[d].reduce(function(s,r){return s+twd(r)},0);var dd=new Date(d+'T00:00:00');var wk='日一二三四五六'[dd.getDay()];
  h+='<div class="day"><span>'+(+d.slice(5,7))+'/'+(+d.slice(8,10))+'（'+wk+'）</span><span>NT$'+n0(dt)+'</span></div>';
  by[d].slice().reverse().forEach(function(r){
   h+='<div class="ent'+(r.pend?' pend':'')+'"><div class="ic">'+(ICON[r.cat]||'📦')+'</div><div class="main"><div class="it">'+esc(r.item||r.cat)+'</div><div class="sub">'+r.payer+' 付'+(r.note?'・'+esc(r.note):'')+'</div></div><div class="money">'+(r.cur==='TWD'?'NT$'+n0(r.amt):'¥'+n0(r.amt))+(r.cur==='TWD'?'':'<small>NT$'+n0(twd(r))+'</small>')+'</div><button class="x" type="button" data-id="'+esc(r.id)+'" aria-label="刪除">✕</button></div>'})});
 $('list').innerHTML=h||'<div class="empty">還沒有記錄。上面輸入金額就能記第一筆。</div>';
 status()}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function status(msg){var el=$('st'),n=S.pend.length;el.className='st';
 if(!API){el.className='st warn';el.innerHTML='📱 尚未連上雲端：目前只存在這支手機'+(n?'（'+n+' 筆待上傳）':'');return}
 if(msg){el.textContent=msg;return}
 if(n){el.className='st warn';el.innerHTML='⏳ '+n+' 筆等網路補傳 <button type="button" id="retry">重試</button>';$('retry').onclick=sync;return}
 el.textContent='☁️ 已同步'+(S.synced?'・'+S.synced:'')}
// ---------- sync ----------
var busy=false;
function stamp(){var d=new Date();S.synced=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function apply(j){if(j&&j.ok&&j.rows){S.rows=j.rows;stamp();save()}}
function post(q){return fetch(API,{method:'POST',body:JSON.stringify(q),redirect:'follow'}).then(function(r){return r.json()})}
function sync(){if(!API||busy)return Promise.resolve();busy=true;status('🔄 同步中…');
 var chain=Promise.resolve(),failed=false;
 S.pend.slice().forEach(function(q){chain=chain.then(function(){if(failed)return;return post(q).then(function(j){
   if(j.ok||/not found|bad /.test(j.error||'')){S.pend=S.pend.filter(function(x){return x!==q});if(!j.ok)flash('有一筆被伺服器拒絕：'+j.error,1);apply(j);save()}else failed=true})
  .catch(function(){failed=true})})});
 return chain.then(function(){if(failed)return;return fetch(API+(API.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(r){return r.json()}).then(apply)})
  .catch(function(){}).then(function(){busy=false;render()})}
// ---------- form ----------
var F={cat:null,payer:S.me,mode:'規則',who:[]};
function pick(id,v){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
function flash(t,err){var m=$('msg');m.textContent=t;m.className='msg '+(err?'err':'ok');clearTimeout(flash.t);flash.t=setTimeout(function(){m.textContent=''},4000)}
function bind(id,fn){$(id).addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(b)fn(b.dataset.v,b)})}
bind('cur',function(v){S.cur=v;pick('cur',v);save()});
bind('cat',function(v){F.cat=v;pick('cat',v)});
bind('payer',function(v){F.payer=v;S.me=v;pick('payer',v);save()});
$('go').addEventListener('click',function(){
 var amt=parseFloat(String($('amt').value).replace(/[,，\s¥$]/g,''));
 if(!(amt>0)){flash('請輸入金額',1);$('amt').focus();return}
 if(!F.cat){flash('請選類別',1);return}
 if(!F.payer){flash('請選誰付的',1);return}
 var rate=parseFloat($('rate').value);if(!(rate>=0.05&&rate<=1))rate=0.21;
 var e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date:$('date').value||today(),cat:F.cat,item:$('item').value.trim().slice(0,60),amt:amt,cur:S.cur,rate:rate,payer:F.payer,mode:F.mode||'規則',who:'',note:$('note').value.trim().slice(0,200)};
 S.pend.push({action:'add',entry:e});S.rate=rate;save();
 $('amt').value='';$('item').value='';$('note').value='';F.cat=null;pick('cat','');
 flash('✅ 已記下 '+(e.cur==='TWD'?'NT$':'¥')+n0(amt)+(API?'':'（只存在這支手機）'));render();sync()});
$('list').addEventListener('click',function(ev){var b=ev.target.closest('button.x');if(!b)return;var id=b.dataset.id;
 var r=view().filter(function(x){return x.id===id})[0];if(!r)return;
 if(!confirm('刪除「'+(r.item||r.cat)+'」'+(r.cur==='TWD'?'NT$':'¥')+n0(r.amt)+'？'))return;
 var pi=-1;S.pend.forEach(function(q,i){if(q.action==='add'&&q.entry.id===id)pi=i});
 if(pi>=0)S.pend.splice(pi,1);else S.pend.push({action:'del',id:id});save();render();sync()});
$('refresh').addEventListener('click',sync);
// init
$('date').value=today();$('rate').value=S.rate||0.21;pick('cur',S.cur);if(S.me)pick('payer',S.me);render();sync();
setInterval(function(){if(document.visibilityState==='visible')sync()},30000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')sync()});
window.addEventListener('online',sync);
</script></body></html>
